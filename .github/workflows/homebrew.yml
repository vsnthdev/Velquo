name: Update Homebrew Tap

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: "Release version without leading v (e.g. 1.3.1)"
                required: true

concurrency:
    group: update-homebrew-tap
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    update-tap:
        if: github.event_name == 'workflow_dispatch' || (github.event.release.draft == false && github.event.release.prerelease == false)
        runs-on: ubuntu-latest

        steps:
            - name: Resolve release metadata and verify DMG checksum
              id: release
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail

                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                    RAW_VERSION="$INPUT_VERSION"
                  else
                    RAW_VERSION="$RELEASE_TAG"
                  fi

                  VERSION="${RAW_VERSION#v}"
                  DMG_NAME="Velquo_${VERSION}_aarch64.dmg"
                  DMG_URL="https://github.com/vsnthdev/Velquo/releases/download/v${VERSION}/${DMG_NAME}"
                  DMG_PATH="${RUNNER_TEMP}/${DMG_NAME}"

                  echo "Downloading ${DMG_URL}..."
                  curl -fsSL "$DMG_URL" -o "$DMG_PATH"
                  SHA256="$(sha256sum "$RUNNER_TEMP/${DMG_NAME}" | awk '{print $1}')"

                  {
                    echo "version=${VERSION}"
                    echo "sha256=${SHA256}"
                  } >> "$GITHUB_OUTPUT"

            - name: Checkout homebrew-tap
              uses: actions/checkout@v7
              with:
                  repository: vsnthdev/homebrew-tap
                  token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
                  path: homebrew-tap

            - name: Update Casks/velquo.rb
              env:
                  VERSION: ${{ steps.release.outputs.version }}
                  SHA256: ${{ steps.release.outputs.sha256 }}
              run: |
                  set -euo pipefail
                  cd homebrew-tap

                  python3 - <<'PY'
                  import os
                  import re
                  import sys

                  path = "Casks/velquo.rb"
                  version = os.environ["VERSION"]
                  sha256 = os.environ["SHA256"]

                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()

                  version_re = re.compile(r'^  version ".*"$', re.MULTILINE)
                  sha256_re = re.compile(r'^  sha256 ".*"$', re.MULTILINE)

                  if not version_re.search(content):
                      sys.exit(f"Missing version stanza in {path}")
                  if not sha256_re.search(content):
                      sys.exit(f"Missing sha256 stanza in {path}")

                  updated = version_re.sub(f'  version "{version}"', content, count=1)
                  updated = sha256_re.sub(f'  sha256 "{sha256}"', updated, count=1)

                  with open(path, "w", encoding="utf-8") as f:
                      f.write(updated)
                  PY

                  git diff -- Casks/velquo.rb

                  if git diff --quiet -- Casks/velquo.rb; then
                    echo "Casks/velquo.rb is already up to date for v${VERSION}."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add Casks/velquo.rb
                  git commit -m "velquo ${VERSION}"
                  git push
