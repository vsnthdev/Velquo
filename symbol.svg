<svg xmlns="http://www.w3.org/2000/svg" viewBox="200 200 624 624" width="512" height="512">
  <defs>
    <clipPath id="bottom-crossing-clip">
      <rect x="458" y="550" width="116" height="125" />
    </clipPath>

    <clipPath id="top-crossing-clip">
      <rect x="366" y="305" width="116" height="118" />
    </clipPath>

    <!-- Exact Contour Over-Under Masks with generous 26px gap for 18pt macOS Menu Bar clarity -->
    <mask id="phone-over-under-mask">
      <rect x="0" y="0" width="1024" height="1024" fill="white" />
      <g clip-path="url(#bottom-crossing-clip)">
        <rect
          x="430"
          y="286"
          width="330"
          height="324"
          rx="82"
          ry="82"
          fill="none"
          stroke="black"
          stroke-width="116"
        />
      </g>
    </mask>

    <mask id="mac-over-under-mask">
      <rect x="0" y="0" width="1024" height="1024" fill="white" />
      <g clip-path="url(#top-crossing-clip)">
        <rect
          x="264"
          y="366"
          width="236"
          height="372"
          rx="78"
          ry="78"
          fill="none"
          stroke="black"
          stroke-width="116"
        />
      </g>
    </mask>
  </defs>

  <!-- Wide Mac Portal Ring (Upper-Right) -->
  <g mask="url(#mac-over-under-mask)">
    <rect
      x="430"
      y="286"
      width="330"
      height="324"
      rx="82"
      ry="82"
      fill="none"
      stroke="#ffffff"
      stroke-width="64"
    />
  </g>

  <!-- Tall Phone Portal Ring (Lower-Left) -->
  <g mask="url(#phone-over-under-mask)">
    <rect
      x="264"
      y="366"
      width="236"
      height="372"
      rx="78"
      ry="78"
      fill="none"
      stroke="#ffffff"
      stroke-width="64"
    />
  </g>
</svg>
