[package]
name = "velquo"
version = "1.1.2"
description = "A fast, native Apple Silicon client for KDE Connect — seamlessly bridging Android and Linux devices with your Mac."
authors = ["vsnthdev"]
edition = "2021"
default-run = "Velquo"

[[bin]]
name = "Velquo"
path = "src/main.rs"

[lib]
name = "velquo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "macos-private-api",
  "tray-icon",
  "image-png",
] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
window-vibrancy = "0.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "logging",
  "tls12",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12",
] }
rustls-pki-types = "1"
rustls-pemfile = "2"
rcgen = "0.13"
x509-parser = "0.16"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
mdns-sd = "0.13"
chrono = "0.4"
dirs = "6"
log = "0.4"
anyhow = "1"
hostname = "0.4"
open = "5"
base64 = "0.22"
libc = "0.2"
resvg = { version = "0.45", default-features = false }
russh = "0.50"
russh-sftp = "2.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSAppearance",
  "NSApplication",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
] }
objc2-foundation = { version = "0.3", features = [
  "NSArray",
  "NSData",
  "NSDictionary",
  "NSObject",
  "NSString",
  "NSUserNotification",
] }

[profile.release]
strip = "none"

[profile.release.build-override]
strip = "none"

[lints.clippy]
too_many_arguments = "allow"


